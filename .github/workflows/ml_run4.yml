name: ML Run in Sequence

# on mentions a trigger for the workflow
on:
  push:

jobs:
  ml_run:
    runs-on: ubuntu-latest

    container:
      image: jupyter/scipy-notebook:latest
      options: --user root


    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check container
        run: |
          echo "Learning is good!"
          echo "I am inside the container"
          whoami
          cat /etc/os-release

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check tslearn
        run: |
          python -c "import tslearn; print('tslearn is installed and working!')"

      - name: Run ML example
        run: |
          python ml_example.py
  deploy:
    needs: ml_run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: deploy
        run: echo 'deployment of the model'

